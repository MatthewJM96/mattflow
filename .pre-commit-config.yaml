repos:
- repo: https://github.com/pre-commit/mirrors-clang-format
  rev: v15.0.4
  hooks:
  - id: clang-format
- repo: https://github.com/pocc/pre-commit-hooks
  rev: v1.3.5
  hooks:
  - id: cppcheck
    args: [--enable=performance, --enable=portability, --force, --check-level=exhaustive, -Iinclude/, --std=c++20]
  - id: cpplint
    args: [--filter=-legal,-build,-runtime/indentation_namespace,-whitespace]
